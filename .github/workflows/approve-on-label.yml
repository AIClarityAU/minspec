# approve-on-label — the label flip IS the approval gesture again (#1113).
#
# The maintainer's original workflow was: change `needs-review` → `agent-ready` in the
# GitHub UI. #983 correctly stopped that from dispatching, because the label was a
# point-in-time STAMP of a verdict that nobody re-checked — five hand-flipped issues
# built and burned tokens. But what was wrong was never "a human flipped a label"; it
# was "nothing recorded WHO flipped it, or WHAT verdict they were overriding".
#
# So: keep the gesture, supply the record. This workflow turns the flip into a real,
# attributed, body-bound human-approval record — the same one `scripts/approve-issue.sh`
# mints on the command line, decided by the same pure predicate in
# `scripts/dispatch-ready-check.sh`. Neither front end carries a policy of its own.
#
# It also makes the gesture SELF-CORRECTING: flipping the label on an issue the gate
# will not release now removes the label again and comments the exact reason, instead of
# silently dispatching (the old failure) or silently holding at dispatch time, far from
# where the human acted.
#
# All logic lives in `scripts/approve-on-label.sh` so it is readable and unit-testable
# (`--verify-label-event`); this file is only the trigger and the credential.
name: approve-on-label

on:
  issues:
    types: [labeled]

# Every AUTHORIZED write is made with the App installation token minted in the job, so
# the actor is `minspec-sdd[bot]` and the audit trail never records agent work under a
# human's account. The default token carries `issues: write` for ONE purpose only — the
# unauthorized bounce below, which must be able to remove the label and explain itself
# WITHOUT a broader App credential ever being minted for an actor who cannot approve.
permissions:
  contents: read
  # `issues: write` exists ONLY so the unauthorized path can remove the label and explain
  # itself WITHOUT minting an App installation token (#1245). That is a net reduction in
  # privilege, not an expansion: the default token scoped to this one repo replaces a
  # broader App credential on exactly the path that should have had neither. Every
  # authorized write below still goes through the App, so the audit trail is unchanged.
  issues: write

# Serialise per issue: two rapid label events must not race to mint two records.
# NOT cancel-in-progress — every event has to reach a decision, and a cancelled run
# would leave `agent-ready` standing with nothing behind it.
concurrency:
  group: approve-on-label-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    # Cheap pre-filter so unrelated label traffic costs nothing. The script re-reads
    # and re-checks both of these from the event file — this `if` is an optimisation,
    # never the guard.
    if: >-
      github.event.label.name == 'agent-ready' &&
      !endsWith(github.event.sender.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      # No `ref:` on purpose. For an `issues` event `github.sha`/`github.ref` already
      # point at the default branch, so the checked-out gate scripts are the ones on
      # `main` — never a version proposed by the work being approved. Writing the ref
      # out explicitly would only add an interpolation into a `ref:` field, which is
      # the ref-injection shape worth not having at all.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the App credential is configured
        id: cfg
        env:
          APP_ID: ${{ secrets.MINSPEC_APP_ID }}
          APP_KEY: ${{ secrets.MINSPEC_APP_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::error title=approve-on-label not configured::MINSPEC_APP_ID / MINSPEC_APP_PRIVATE_KEY are required. A human flipped a label expecting it to approve the issue; without the App token nothing can record that, so this FAILS rather than passing silently (DR-066 — no silent gate)."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # ── Permission BEFORE privilege (#1245) ────────────────────────────────
      # The App installation token is broader than this job needs; minting it for an
      # actor who turns out to have no write access hands a privileged credential to the
      # unauthorized path. So the check moves ahead of the mint, and runs on the DEFAULT
      # `GITHUB_TOKEN`, which needs no extra scope to read a collaborator permission.
      #
      # It does NOT hard-fail. A hard exit here would leave `agent-ready` standing with
      # no explanation, losing the self-correcting bounce that is the point of #1113 —
      # trading one hygiene problem for a worse UX one. Instead it records a verdict the
      # later steps branch on, and the bounce still happens (see below).
      #
      # It is an OPTIMISATION, never the gate. The authoritative check remains the
      # App-token one inside approve-on-label.sh; this only avoids minting a broad
      # credential when the actor is DEFINITIVELY unauthorized.
      #
      # `SENDER` is passed via `env:`, never interpolated into the script body: a login
      # is constrained, but the shape "untrusted field inside run:" is worth never having.
      - name: Check the actor may approve, before any privilege is minted
        id: perm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -eu
          # THREE outcomes, not two. Collapsing "the check failed" into "the actor is
          # denied" would let one 403 silently lock out every maintainer and bounce them
          # with a `permission: none` message that is simply untrue — an errored witness
          # reported as a verdict, which is constitution invariant 2 exactly.
          #
          # `GET /collaborators/{user}/permission` is a privileged read, and the default
          # token's ability to make it is NOT something to assume: the pre-existing check
          # in approve-on-label.sh deliberately used the broader App token. So on ANY
          # failure this yields `unknown` and defers to that proven check rather than
          # denying. Unauthorized actors are still caught there; the only thing lost in
          # the unknown case is the early exit, which is an optimisation, never the gate.
          if perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${SENDER}/permission" --jq '.permission' 2>/dev/null)"; then
            case "${perm}" in
              admin|write|maintain) echo "authorized=true"  >> "$GITHUB_OUTPUT" ;;
              *)                    echo "authorized=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "permission=${perm:-none}" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=unknown" >> "$GITHUB_OUTPUT"
            echo "permission=unreadable" >> "$GITHUB_OUTPUT"
            echo "::warning title=Early permission check could not run::The default GITHUB_TOKEN could not read the collaborator permission for this actor. NOT treating that as a denial — deferring to the authoritative App-token check in approve-on-label.sh. The App token is minted for this run as a result."
          fi

      # Bounce WITHOUT the App token. `issues: write` on the default token is a much
      # narrower credential than an App installation token, so the unauthorized path
      # costs strictly less privilege than it did before this change.
      - name: Remove the label and explain, when the actor may not approve
        if: steps.perm.outputs.authorized == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
          PERM: ${{ steps.perm.outputs.permission }}
        run: |
          set -eu
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label agent-ready >/dev/null 2>&1 || true
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$(printf '## ⏸ `agent-ready` removed — @%s may not approve issues here\n\nApproving an issue for an agent to build requires write access to this repository; the permission recorded for this account is `%s`.\n\nThe label flip **is** the approval gesture (#1113) — it just has to pass the same gate the CLI does. Nothing was deleted. Ask a maintainer to approve it.' "$SENDER" "$PERM")" >/dev/null 2>&1 || true
          echo "::notice::Bounced: ${SENDER} holds '${PERM}', which cannot approve."

      - name: Mint the App installation token
        id: app
        if: steps.perm.outputs.authorized != 'false'
        uses: actions/create-github-app-token@f2acddfb5195534d487896a656232b016a682f3c # v1.9.0
        with:
          app-id: ${{ secrets.MINSPEC_APP_ID }}
          private-key: ${{ secrets.MINSPEC_APP_PRIVATE_KEY }}

      # No `${{ }}` interpolation of issue-controlled text anywhere in this run block:
      # the script reads the issue number, label and sender from $GITHUB_EVENT_PATH
      # itself, so an issue title or body can never reach the shell.
      - name: Approve the issue, or bounce the label and say why
        if: steps.perm.outputs.authorized != 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash scripts/approve-on-label.sh
