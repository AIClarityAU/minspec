# alta-self-merge — merge a pull request that carries ONLY the founder's own Alt-A.
#
# DR-111. Founder decision in36 (2026-10-21), verbatim: "let PRs that only land his own Alt-A
# (an approval or acceptance he made in the editor) merge themselves once a check
# proves they carry only that approval."
#
# The check is `scripts/alta-self-merge.ts` (judge: `scripts/lib/alta-approval-only.ts`).
# It merges, as `minspec-sdd[bot]`, only when ALL of these hold, and otherwise leaves the
# pull request for the founder exactly as before:
#   - the diff is approval record(s) under `.minspec/approvals/` plus, in the matching
#     spec/DR/epic file, the frontmatter `status:`/`phases:` change and no other byte;
#   - each record parses through the repo's own sidecar reader, is attributed to the
#     founder, and its `specHash` equals `specHash()` of the artifact on the head;
#   - the PR is the founder's, from this repo, up to date with its base, labelled
#     `ai-review:pass` with no `hold:*`;
#   - every required status check in the default branch's ruleset is green on the head.
# The merge is a squash through the merge API with `sha=<judged head>`, so a push after
# the judgement makes GitHub refuse it. Never `--admin`; the ruleset still decides.
#
# ── Trust boundary ────────────────────────────────────────────────────────────
# `workflow_run` and `workflow_dispatch` both run the workflow file and the checked-out
# scripts from the DEFAULT BRANCH. Nothing from the pull request is ever executed: its
# commits are fetched as data and read with `git cat-file` / `git diff`. So a pull
# request cannot change the check that judges it. That is why this is not a
# `pull_request` workflow.
#
# Fails closed and loud (constitution invariant 2): a missing App credential, a git or
# API failure, or an unreadable input fails this run red and merges nothing. A decline
# is a normal, green outcome; the founder merges as before.
name: alta-self-merge

on:
  # The last required check to finish on a head is what makes a PR mergeable, so
  # re-judge whenever any workflow producing a required check completes.
  workflow_run:
    workflows: [CI, MinSpec Validate, ai-review-runner, ready-to-merge]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to judge (and merge if eligible)
        required: true

# The default token only reads. Every write uses the App installation token minted below.
permissions:
  contents: read

# One judgement per head at a time; never cancelled, so every completion is judged.
concurrency:
  group: alta-self-merge-${{ github.event.workflow_run.head_sha || github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  judge-and-merge:
    # Cheap pre-filter: only runs for pull-request events from this repository. The
    # script re-derives everything from the API; this `if` can only skip, never admit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'pull_request_target') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # No `ref:`: both triggers check out the default branch, so the judge is main's.
      # Full history, so the base-ancestry check can run.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Check the App credential is configured
        env:
          APP_ID: ${{ secrets.MINSPEC_APP_ID }}
          APP_KEY: ${{ secrets.MINSPEC_APP_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::error title=alta-self-merge not configured::MINSPEC_APP_ID / MINSPEC_APP_PRIVATE_KEY are required to merge as minspec-sdd[bot]. Failing rather than passing silently (constitution invariant 2)."
            exit 1
          fi

      - name: Mint the App installation token
        id: app
        uses: actions/create-github-app-token@f2acddfb5195534d487896a656232b016a682f3c # v1.9.0
        with:
          app-id: ${{ secrets.MINSPEC_APP_ID }}
          private-key: ${{ secrets.MINSPEC_APP_PRIVATE_KEY }}

      # Event fields reach the shell only through `env:`, never interpolated into `run:`.
      # The script validates both shapes (`--pr` a positive integer, `--head-sha` 40 hex).
      - name: Judge, and merge when eligible and green
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.inputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # The founder's identity. Changing it is a change to this file, which is
          # machinery and needs his own merge.
          ALTA_FOUNDER_LOGINS: harvest316
          ALTA_FOUNDER_EMAILS: github@harvest316.com
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::App token is empty; refusing to run under any other identity."
            exit 1
          fi
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            target=(--pr "${PR}")
          else
            target=(--head-sha "${HEAD_SHA}")
          fi
          # Capture the exit code so the summary is written before a failure is reported;
          # the code is re-raised below, never discarded.
          rc=0
          npx tsx scripts/alta-self-merge.ts --repo "${GITHUB_REPOSITORY}" "${target[@]}" --merge > alta-outcome.jsonl || rc=$?
          cat alta-outcome.jsonl
          {
            echo "### alta-self-merge"
            echo
            echo '```'
            cat alta-outcome.jsonl
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"
