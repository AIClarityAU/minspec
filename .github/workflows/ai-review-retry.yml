# ai-review-retry — auto-pick-up quota-blocked reviews (companion to ai-review.yml)
#
# When the Claude subscription session quota is exhausted mid-week, ai-review.yml
# cannot produce a verdict and labels the PR `ai-review:blocked` (retry-able, NOT a
# code verdict — see ai-review-guard.js isQuotaExhaustion / decideReviewCheck). This
# scheduled workflow finds those PRs and RE-RUNS their latest ai-review run, so once
# the quota window resets the review completes on its own and the block clears — the
# dev never has to notice or hand-retrigger.
#
# Also surfaced to humans: `ai-review:blocked` is a normal label, so a VS Code
# fan-out / next-task resolver can list these as pending re-review tasks (#503-adjacent).
#
# `gh run rerun` re-executes the run in its original PR context (same head SHA),
# minting a FRESH App/subscription token — the whole point: a new token past the
# reset window succeeds. If quota is still out, the rerun re-blocks and we try again
# next tick (cheap: gh calls; the paid review only runs when a rerun actually fires).

name: ai-review-retry

on:
  schedule:
    # Hourly, offset off the top of the hour to dodge scheduler congestion.
    - cron: '17 * * * *'
  workflow_dispatch: {}

# Least privilege: read code, and `actions: write` ONLY to re-run the ai-review runs.
permissions:
  contents: read
  actions: write
  # `write`, not `read` (#1630 review): the unevidenced-block guard applies
  # `needs-human-review` so an inferred-quota block surfaces as a decision instead of
  # looping forever. With `read` that call fails and the guard's whole point — summoning
  # a human — silently does nothing while still reading as implemented. Still least
  # privilege: labels are the only PR mutation this workflow makes.
  pull-requests: write
  # #1675 review (Skeptic, blocking): the guard's self-heal calls `gh label create`
  # before `--add-label`, and label CREATION is a repo-level Issues-API operation —
  # ai-review.yml:106-107 documents this repo's own working permission split
  # ("pull-requests: write + issues: write (labels/comments use the issues API)").
  # `pull-requests: write` alone lets `--add-label` attach an EXISTING label (that
  # is how this workflow already worked pre-#1675), but `gh label create` 403s
  # without `issues: write` — the failure is swallowed by `|| true`, so omitting
  # this scope would silently no-op the exact self-heal this guard adds.
  issues: write

concurrency:
  group: ai-review-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run ai-review for quota-blocked PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Open PRs the reviewer could not run on (quota/transient). Cap at 25 per
          # tick so a large backlog can't fan out into a token stampede — the rest
          # roll to the next hourly tick.
          mapfile -t rows < <(
            gh pr list --repo "$REPO" --state open --label "ai-review:blocked" \
              --json number,headRefName --jq '.[] | "\(.number)\t\(.headRefName)"' | head -25
          )
          if [ "${#rows[@]}" -eq 0 ]; then
            echo "No ai-review:blocked PRs — nothing to retry."
            exit 0
          fi
          echo "Found ${#rows[@]} blocked PR(s) to retry."

          for row in "${rows[@]}"; do
            num="${row%%$'\t'*}"
            branch="${row#*$'\t'}"
            [ -z "$num" ] && continue
            # #1630 — a block with NO EVIDENCE is not known to be transient. `reason: quota`
            # is a fallback INFERENCE in that case (review-branch.sh emits
            # `evidence: NONE (reason is inferred, not observed)` when neither stream carried
            # text), so a genuine crash that writes nothing is indistinguishable from a real
            # outage — and retrying it forever is how it stays invisible. Retry only what we
            # have evidence IS retry-able; hand the rest to a human.
            #
            # Fail-safe direction: a comment with NO evidence line at all is an OLD-format
            # block from before #1635, and those DO get retried (the `!= NONE` test below is
            # false only when the marker is present and says NONE). Silence must never mean
            # "give up".
            evidence=$(gh pr view "$num" --repo "$REPO" --json comments \
              --jq '[.comments[].body | capture("evidence: (?<e>NONE|captured)").e] | last // empty' 2>/dev/null || true)
            if [ "$evidence" = "NONE" ]; then
              echo "PR #$num: reviewer produced NO diagnostic on either stream — 'quota' is inferred, not observed."
              echo "  Not retrying: an unevidenced block may be a genuine crash, and looping it hides that (#1630)."
              # Self-heal first (matches ai-review.yml:1146/1200): this workflow is
              # scaffolded byte-identically into adopter repos, and a quota-blocked PR
              # can reach this guard on a FRESH repo where `needs-human-review` was
              # never created (ai-review.yml only creates it on the summon-human /
              # fail-closed paths, never the quota-blocked path). Without the create
              # first, `--add-label` on a nonexistent label fails and the `|| echo`
              # below silently swallows it — the exact "reads as implemented but does
              # nothing" failure this guard exists to fix (#1675 review).
              gh label create "needs-human-review" --repo "$REPO" \
                --color FBCA04 --description "A human is the next actor — auto-merge withheld" \
                >/dev/null 2>&1 || true
              gh pr edit "$num" --repo "$REPO" --add-label "needs-human-review" >/dev/null 2>&1 \
                || echo "  (could not add needs-human-review — surface it by hand)"
              continue
            fi

            # #1204 — honour the stated reset time. The reviewer records it as an
            # `<!-- ai-review-reset: ISO -->` marker on its blocked comment; if that
            # instant has not passed, every attempt is guaranteed futile and costs a
            # paid token. On #1602 five of six attempts fired inside the window.
            #
            # A MISSING marker means "not stated" and must fall through to the normal
            # cadence — never to "skip forever". Failing to parse must not strand a PR,
            # so the default below is to retry.
            reset=$(gh pr view "$num" --repo "$REPO" --json comments \
              --jq '[.comments[].body | capture("<!-- ai-review-reset: (?<t>[^ ]+) -->").t] | last // empty' 2>/dev/null || true)
            if [ -n "$reset" ]; then
              now_s=$(date -u +%s)
              reset_s=$(date -u -d "$reset" +%s 2>/dev/null || echo 0)
              if [ "$reset_s" -gt "$now_s" ]; then
                echo "PR #$num: quota window resets at $reset ($(( (reset_s - now_s) / 60 ))m away) — skipping, not spending a token."
                continue
              fi
            fi

            # Latest ai-review run for this PR's branch → re-run it (fresh token).
            rid=$(gh run list --repo "$REPO" --workflow ai-review.yml \
              --branch "$branch" --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
            if [ -n "$rid" ]; then
              echo "PR #$num ($branch): re-running ai-review run $rid"
              gh run rerun "$rid" --repo "$REPO" 2>/dev/null \
                || echo "  rerun failed for #$num (run may be too old to re-run; a new push/reopen will re-review)"
            else
              echo "PR #$num ($branch): no prior ai-review run found — skipping"
            fi
          done
