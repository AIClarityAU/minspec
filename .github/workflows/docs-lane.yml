name: docs-lane

# Option 2 of DR-051's docs-push reconciliation (#575): a docs-only PR that opts
# into the lane with the `docs-lane` label gets GitHub auto-merge enabled, so it
# lands on main WITHOUT a manual merge click — while the SAME required checks
# (lint · test · MinSpec SDD validation · ai-review · ready-to-merge) still gate
# it. Nothing is bypassed; it merely merges automatically once green.
#
# Hard path-enforcement (what actor-trust bypass could not give): a `docs-lane`
# PR that touches ANY non-docs path fails this job (misuse alarm) and is NOT
# auto-merged. Code physically cannot ride the lane. Substantive new DRs/specs
# simply don't carry the label → normal human review (the DR-055 pattern).
#
# Two further refusals, both added by #1847 after this lane armed auto-merge on a PR
# that was explicitly held: a `hold:*` label stops the lane (and REVOKES an arming an
# earlier run already made), and so does a change to a `status:` frontmatter line in
# docs/decisions/** or specs/**, because DR acceptance and spec approval are human acts
# that happen to be docs-only.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-lane-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-lane:
    # Only when the author opted in via the label.
    if: contains(github.event.pull_request.labels.*.name, 'docs-lane')
    runs-on: ubuntu-latest
    steps:
      - name: Verify docs-only, then enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Allowed corpus: specs, docs, skills markdown (.md ONLY), approval records, top-level markdown.
          allowed='^(specs/|docs/|skills/.*\.md$|\.minspec/approvals/|[^/]+\.md$)'
          # OUTWARD-FACING DENYLIST (#1001), applied ON TOP of the corpus above.
          # "Is it a doc?" is only a proxy for "is it low-consequence?" while the prose stays
          # INSIDE the repo. It inverts for prose that FACES THE USER: README/CHANGELOG render
          # on the Marketplace + GitHub landing pages, LICENSE/NOTICE are legal instruments,
          # packages/*/media/walkthrough/*.md is the Getting Started copy shipped in the .vsix,
          # and sites/** deploys to minspec.dev on merge. Those state PUBLIC PRODUCT CLAIMS —
          # higher consequence than most code, and the maintainer's human-only class — so they
          # must not auto-merge, even though the corpus regex above happily admits a top-level
          # README.md. Kept BYTE-IDENTICAL to OUTWARD_DOC_PATTERN in scripts/auto-merge-gate.ts
          # so the merge gate and this lane cannot disagree; the pairing is pinned by
          # packages/minspec/tests/outward-docs-exclusion.test.ts. `allowed=` above is itself
          # lock-step-pinned to docs-corpus.ts/.sh, which is why this is a SEPARATE denylist
          # rather than an edit to the shared corpus.
          outward='^sites/|(^|/)(README|CHANGELOG|LICEN[CS]E|NOTICE|THIRD-PARTY-NOTICES)([.-][^/]*)?$|^packages/[^/]+/[^/]+[.](md|mdx|markdown|txt|rst|adoc)$|^packages/[^/]+/media/'
          # Every `gh api` below is a GATE WITNESS, so its failure must fail the gate
          # CLOSED and visibly (constitution invariant 2). A `< <(...)` process
          # substitution does NOT do that: under `set -euo pipefail` a failure inside
          # it is not caught, `mapfile`/`while` still return 0, and the gate reads an
          # empty result as "nothing to object to". Capture-then-check instead, so a
          # transient or rate-limited API call refuses rather than arms.
          if ! files_raw="$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[].filename')"; then
            echo "::error::docs-lane: could not list PR #$PR's files — refusing to arm"
            exit 1
          fi
          files=()
          [ -n "$files_raw" ] && mapfile -t files <<<"$files_raw"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::docs-lane: PR #$PR has no files"
            exit 1
          fi
          bad=()
          outward_bad=()
          for f in "${files[@]}"; do
            [[ "$f" =~ $allowed ]] || bad+=("$f")
            # -i: GitHub/npm/vsce resolve these basenames case-insensitively, so `readme.md`
            # publishes just the same. Guarded by `if` so `set -e` does not trip on grep's
            # no-match exit 1.
            if grep -qiE "$outward" <<<"$f"; then outward_bad+=("$f"); fi
          done
          if [ "${#bad[@]}" -gt 0 ]; then
            printf '::error::docs-lane label but non-docs path(s): %s\n' "${bad[*]}"
            gh pr comment "$PR" --repo "$REPO" --body \
              "🚫 **docs-lane misuse** — this PR carries \`docs-lane\` but touches non-docs path(s): \`${bad[*]}\`. Auto-merge NOT enabled. Remove the label and get a human review, or split the change." || true
            exit 1
          fi
          if [ "${#outward_bad[@]}" -gt 0 ]; then
            printf '::error::docs-lane: outward-facing (published) doc(s): %s\n' "${outward_bad[*]}"
            gh pr comment "$PR" --repo "$REPO" --body \
              "🚫 **docs-lane: outward-facing docs** — this PR changes doc(s) that are **published to users**: \`${outward_bad[*]}\`. README/CHANGELOG render on the Marketplace and GitHub landing pages, LICENSE/NOTICE are legal instruments, \`media/walkthrough/\` ships inside the \`.vsix\`, and \`sites/**\` deploys to minspec.dev on merge — so a wrong word here is published and cannot be un-said by a revert. Auto-merge NOT enabled (#1001); this needs a human merge keystroke. Split the inward docs into their own PR if you want them on the lane." || true
            exit 1
          fi
          # ── HUMAN-HOLD GATE (#1847) ────────────────────────────────────────────
          # A `hold:*` label is the maintainer's explicit "no automation lands this"
          # (DR-072 §3: "no approval lifts it"). It was enforced on the ISSUE-dispatch
          # side (scripts/approve-on-label.sh, approve-issue.sh, dispatch-issue.sh) and
          # nowhere on the MERGE side, so it was decorative exactly where it mattered.
          # Measured on #1741: `hold:human` was applied at 22:09:26 and this lane armed
          # auto-merge at 22:09:34 — 8 seconds later, on a PR whose auto-merge had
          # already been disarmed by hand once. Only an unrelated `ai-review:changes`
          # kept it from landing a DR ratification with no human act (#1816).
          hold_pattern='^hold:'
          if ! labels_raw="$(gh api "repos/$REPO/pulls/$PR" -q '.labels[].name')"; then
            echo "::error::docs-lane: could not read PR #$PR's labels — refusing to arm rather than assuming it is unheld"
            exit 1
          fi
          labels=()
          [ -n "$labels_raw" ] && mapfile -t labels <<<"$labels_raw"
          held=()
          for l in "${labels[@]}"; do
            if grep -qE "$hold_pattern" <<<"$l"; then held+=("$l"); fi
          done

          # ── GOVERNANCE STATUS-TRANSITION GATE (#1847) ──────────────────────────
          # The label gate above only fires when somebody REMEMBERED to apply a label,
          # so it is a floor, not a fix. This one keys on what the change DOES.
          # Every human-act artefact in this repo is markdown, so a DR acceptance or a
          # spec approval is docs-only BY CONSTRUCTION and reads as "inward" to the
          # outward denylist above — i.e. the lane with the weakest gate is the one
          # every governance ratification travels down. DR-029 (a DR is born
          # `proposed`; acceptance is a separate human act) and DR-086 §2 (DR
          # acceptance and T3/T4 spec approval always stop and ask) both reserve this
          # transition for a human.
          #
          # Deliberately narrow: it fires on a changed `status:` FRONTMATTER LINE, not
          # on any edit to a governance file. A typo fix in a DR body still rides the
          # lane, which is the whole point of the lane. Matching the file rather than
          # the line is the coarse-discriminant mistake (#1754) this is avoiding.
          # A brand-new DR or spec (an all-`+` patch containing `+status: proposed`) also
          # matches, so it is refused from the lane too. That is intended and fail-closed:
          # a substantive new DR/spec has never ridden this lane (see the header note), and
          # the alternative — parsing the transition's direction — would be a second place
          # to be wrong about which transitions are human acts.
          govern='^(docs/decisions/|specs/)'
          if ! files_tsv="$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                              -q '.[] | [.filename, (.patch // "" | @base64)] | @tsv')"; then
            echo "::error::docs-lane: could not read PR #$PR's patches — refusing to arm rather than assuming no status transition"
            exit 1
          fi
          status_changed=()
          if [ -n "$files_tsv" ]; then
            while IFS=$'\t' read -r fname patch_b64; do
              [[ "$fname" =~ $govern ]] || continue
              if [ -z "$patch_b64" ]; then
                # GitHub omits `.patch` for very large diffs. An ABSENT witness is an
                # unknown, not a "no" — the one reading that would let a status
                # transition buried in an oversized governance diff reach the lane.
                status_changed+=("$fname (no patch returned — treated as a transition)")
                continue
              fi
              if printf '%s' "$patch_b64" | base64 -d 2>/dev/null | grep -qE '^[+-]status:'; then
                status_changed+=("$fname")
              fi
            done <<<"$files_tsv"
          fi

          if [ "${#held[@]}" -gt 0 ] || [ "${#status_changed[@]}" -gt 0 ]; then
            # Arming is STICKY: a previous run of this lane may already have enabled
            # auto-merge before the hold was applied (that is the #1741 sequence), so
            # refusing to arm now is not sufficient — the earlier arming has to be
            # revoked. Only attempted when actually armed, so "nothing to disarm" is
            # not reported as a failure; and NEVER swallowed with `|| true`, because a
            # disarm that silently fails leaves a held PR armed (constitution
            # invariant 2 — no silent gate).
            # This read is a witness too. If it fails we must not conclude "not armed" —
            # that is the same fail-open the rest of this step was hardened against — and
            # we must not simply exit either, because exiting BEFORE the disarm leaves a
            # previously-armed hold armed. Unknown ⇒ attempt the disarm anyway and say so.
            if ! armed="$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest -q '.autoMergeRequest.enabledAt // ""')"; then
              echo "::error::docs-lane: could not read PR #$PR's auto-merge state — attempting a disarm regardless"
              armed="unknown"
            fi
            disarm_note=""
            if [ -n "$armed" ]; then
              if gh pr merge --disable-auto --repo "$REPO" "$PR"; then
                disarm_note=" Auto-merge was already enabled and has been **disarmed**."
              elif [ "$armed" = "unknown" ]; then
                # Indistinguishable here from "there was nothing to disarm", so report the
                # uncertainty rather than either reassuring or crying wolf.
                echo "::error::docs-lane: auto-merge state unreadable and the disarm did not succeed — verify by hand that PR #$PR is not armed"
                disarm_note=" ⚠️ Auto-merge state could **not** be read and a precautionary disarm did not succeed — check by hand that this PR is not armed."
              else
                echo "::error::docs-lane: could not disarm auto-merge on a held PR — it is STILL ARMED"
                disarm_note=" ⚠️ Auto-merge was already enabled and could **not** be disarmed — disarm it by hand."
              fi
            fi
            if [ "${#held[@]}" -gt 0 ]; then
              printf '::error::docs-lane: held by label(s): %s\n' "${held[*]}"
              gh pr comment "$PR" --repo "$REPO" --body \
                "🚫 **docs-lane: held** — this PR carries \`${held[*]}\`, which means no automation lands it (DR-072 §3). Auto-merge NOT enabled.${disarm_note} Remove the hold label when a human has decided, then re-run this check." || true
            fi
            if [ "${#status_changed[@]}" -gt 0 ]; then
              printf '::error::docs-lane: governance status transition in: %s\n' "${status_changed[*]}"
              gh pr comment "$PR" --repo "$REPO" --body \
                "🚫 **docs-lane: governance status transition** — this PR changes a \`status:\` frontmatter line in \`${status_changed[*]}\`. Accepting a DR or approving a spec is a **human act** (DR-029, DR-086 §2), and it is docs-only by construction, so the docs corpus check above cannot see it. Auto-merge NOT enabled (#1847).${disarm_note} This needs a human merge keystroke. Split any unrelated docs into their own PR if you want those on the lane." || true
            fi
            exit 1
          fi

          echo "docs-only ✓ (${#files[@]} file(s)) — enabling auto-merge"
          gh pr merge --auto --squash --repo "$REPO" "$PR"
          gh pr comment "$PR" --repo "$REPO" --body \
            "✅ **docs-lane** — docs-only (${#files[@]} file(s)); auto-merge enabled. Merges once the required checks pass (ai-review still runs). Nothing bypassed." || true
